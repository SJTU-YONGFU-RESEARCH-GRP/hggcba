[project]
name = "hggcba"
version = "0.1.0"
description = "Hierarchical Group-Generate Carry-Bypass Adder (HGGCBA): Python model, RTL, and tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "SJTU Yongfu Research Group" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
